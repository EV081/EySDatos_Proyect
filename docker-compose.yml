# Postgres del directorio de llaves (F1). En local el directorio corre con `make directory` en el host; ver directory/README.md.
# Para un servidor: `docker compose --profile deploy up -d directory` levanta solo el directorio, con la base en Supabase
# (docs/despliegue-ec2.md) o en el `db` de al lado (docs/despliegue-directorio.md).
# El puerto se publica solo en 127.0.0.1 y en 55432 para no chocar con un Postgres local.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: directory
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - directory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d directory"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Solo con `--profile deploy`. El certificado y la CA se montan (nunca van en la imagen); los secretos salen del .env.
  # No depende de `db`: DATABASE_URL apunta a Supabase o, si se usa el Postgres de al lado, a `db:5432`.
  directory:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: directory/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL en .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?define DISCORD_CLIENT_ID en .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?define DISCORD_CLIENT_SECRET en .env}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?define DISCORD_REDIRECT_URI en .env}
      PSEUDONYM_KEY: ${PSEUDONYM_KEY:?define PSEUDONYM_KEY en .env}
      AUDIT_LOG_DIR: /var/log/directory
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8443:8443"
    volumes:
      - ./ops/certs:/app/ops/certs:ro
      - directory-logs:/var/log/directory
    restart: unless-stopped

volumes:
  directory-db:
  directory-logs:

openapi: 3.1.0
info:
  title: Directorio de llaves
  version: "1.0"
  description: |
    Asocia IDs de Discord con llaves públicas de firma Ed25519 (F1). Los binarios viajan en base64url sin relleno.
    Publicar, cambiar o cancelar exige un token de registro (OAuth2 con Discord, 10 min, un solo uso, ligado al ID)
    y una prueba de posesión firmada sobre un nonce de un solo uso. Todos los errores son genéricos:
    `{"error": "solicitud inválida" | "solicitud rechazada" | "no encontrado" | "demasiadas solicitudes" | "error interno"}`.
servers:
  - url: https://localhost:8443
    description: Con TLS 1.3 y la CA del proyecto (F2)
  - url: http://127.0.0.1:8000
    description: Solo desarrollo local
components:
  securitySchemes:
    registrationToken:
      type: http
      scheme: bearer
      description: Token emitido por /auth/callback. 32 bytes en base64url.
  schemas:
    DiscordId:
      type: string
      pattern: "^[0-9]{17,20}$"
    B64:
      type: string
      pattern: "^[A-Za-z0-9_-]+$"
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
  responses:
    BadRequest: {description: Entrada malformada, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Rejected: {description: "Token, nonce o firma inválidos, o el token es de otro ID", content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    TooMany: {description: Límite de solicitudes por IP, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  parameters:
    DiscordIdPath:
      name: discord_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/DiscordId"}
paths:
  /auth/login:
    get:
      summary: Redirige a Discord (alcance identify, state y PKCE S256)
      responses:
        "302": {description: Redirección a https://discord.com/oauth2/authorize}
        "429": {$ref: "#/components/responses/TooMany"}
  /auth/callback:
    get:
      summary: Vuelta de Discord; muestra el token de registro en una página HTML (no-store)
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: Página con el token de registro}
        "400": {description: State inválido o Discord no confirmó la cuenta}
  /v1/challenge:
    post:
      summary: Entrega un nonce de 32 bytes para la prueba de posesión (2 min, un solo uso)
      security: [{registrationToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discord_id, purpose]
              properties:
                discord_id: {$ref: "#/components/schemas/DiscordId"}
                purpose: {type: string, enum: [register, cancel]}
      responses:
        "200":
          description: Nonce
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce: {$ref: "#/components/schemas/B64"}
                  expires_in: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Rejected"}
        "429": {$ref: "#/components/responses/TooMany"}
  /v1/keys/{discord_id}:
    parameters:
      - $ref: "#/components/parameters/DiscordIdPath"
    get:
      summary: Llave pública publicada para ese ID
      responses:
        "200":
          description: Llave
          content:
            application/json:
              schema:
                type: object
                properties:
                  discord_id: {$ref: "#/components/schemas/DiscordId"}
                  public_key: {$ref: "#/components/schemas/B64"}
        "404": {description: No registrado}
        "429": {$ref: "#/components/responses/TooMany"}
    put:
      summary: Publica o cambia la llave (consume el token)
      description: |
        `signature` = `sign_registration(identity, discord_id, nonce)`. Si se envía `old_signature`
        (`sign_key_change(old_identity, discord_id, new_public_key, nonce)`), debe validar con la llave vigente.
        Publicar la misma llave es idempotente y renueva la versión del aviso aceptado.
      security: [{registrationToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, nonce, signature, consent_version]
              properties:
                public_key: {$ref: "#/components/schemas/B64"}
                nonce: {$ref: "#/components/schemas/B64"}
                signature: {$ref: "#/components/schemas/B64"}
                consent_version: {type: string, pattern: "^[0-9A-Za-z.\\-]{1,32}$"}
                old_signature: {$ref: "#/components/schemas/B64"}
      responses:
        "204": {description: Publicada}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Rejected"}
        "429": {$ref: "#/components/responses/TooMany"}
    delete:
      summary: Cancela el registro (borra la llave y las reemplazadas en el acto)
      description: "`signature` = `sign_key_change(identity, discord_id, 32 bytes en cero, nonce)` con un nonce de propósito `cancel`."
      security: [{registrationToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce, signature]
              properties:
                nonce: {$ref: "#/components/schemas/B64"}
                signature: {$ref: "#/components/schemas/B64"}
      responses:
        "204": {description: Cancelado}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Rejected"}
        "429": {$ref: "#/components/responses/TooMany"}
